# Models, sampling and the experiment matrix. Keys (API) live in .env, never here.

# ---------- models ----------
# provider = "openai_compatible": OpenRouter (or any OpenAI-compatible API), key from api_key_env
# provider = "ollama": local Ollama server (native API, so the context size num_ctx can be set)
# price_in / price_out: USD per 1M tokens (input / output), used for cost per 1000 documents

[models.gpt4o_mini]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "openai/gpt-4o-mini"
price_in = 0.15
price_out = 0.60
timeout_s = 60
max_retries = 2

[models.qwen3b]
provider = "ollama"
base_url = "http://localhost:11434"
model = "qwen2.5:3b"
num_ctx = 8192          # Ollama default is smaller and silently cuts long texts
price_in = 0.0
price_out = 0.0
timeout_s = 300
max_retries = 1

# Third model: a cheap cloud model through the same OpenRouter interface.
# If it rejects strict schemas (HTTP 400), set response_format = "json_object".
[models.gemini_flash_lite]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "google/gemini-2.5-flash-lite"
price_in = 0.10
price_out = 0.40
timeout_s = 60
max_retries = 2

# Reads scanned pages (agro/corpus/vision_ocr.py): an image in, Markdown out.
# Output price includes the "thinking" tokens of the model.
[models.gemini_flash]
provider = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "google/gemini-2.5-flash"
response_format = "text"
price_in = 0.30
price_out = 2.50
timeout_s = 180
max_retries = 2

# Optional: a stronger local model if the laptop has 16 GB RAM or more.
# Add ["qwen7b", "v1", "t0"] to experiments below to use it.
[models.qwen7b]
provider = "ollama"
base_url = "http://localhost:11434"
model = "qwen2.5:7b"
num_ctx = 8192
price_in = 0.0
price_out = 0.0
timeout_s = 600
max_retries = 1

# ---------- sampling ----------
[sampling.t0]
temperature = 0.0
top_p = 1.0

[sampling.t07]
temperature = 0.7
top_p = 0.9

# ---------- runs ----------
[extract]
max_tokens = 1500
cache = true            # replay identical T=0 requests from .cache/responses/ (no second payment)
# model x prompt version x sampling; `make extract-run` runs every row that has no result file yet
# Local runs on a laptop CPU are slow (measured: about 3-5 min per text, 2-3 hours per run).
experiments = [
  ["gpt4o_mini", "v1", "t0"],
  ["gpt4o_mini", "v1", "t07"],
  ["qwen3b", "v1", "t0"],
  ["gpt4o_mini", "v2", "t0"],
  ["qwen3b", "v2", "t0"],
  ["qwen3b", "v2", "t07"],
  ["gemini_flash_lite", "v2", "t0"],
]
# Prompt v3 was rejected by the regression check (results/extract/regression/), so it is not in the matrix.


# ---------------------------------------------------------------- stage 2: RAG
[corpus]
# Scanned pages: "vision" (models.gemini_flash, transcripts kept in data/ocr/) or "easyocr" (local, weaker)
ocr_engine = "vision"

[rag]
# Chosen on the dev questions by `make rag-retrieval-eval` (results/rag/retrieval_dev.md).
embedding = "e5"        # minilm | mpnet | e5 (agro/rag/embed.py)
reranker = "bge"        # jina | bge (agro/rag/search.py)
chunk_tokens = 450      # structural chunk size, tokens (agro/rag/chunking.py; compared: part D)
rerank_top = 20         # candidates reordered by the reranker (20 vs 10: part E; time grows with it)
bm25_tokens = "lemma"   # lemma | stem6 | none: words of BM25 (results/rag/retrieval_dev.md, part F)
fusion = "rrf"          # rrf | relative: how the vector and BM25 lists are joined (part F)
bm25_weight = 0.3       # rrf: weight of the BM25 list, the vector list has 1 (part F: 1.0 ... 0.1)
fusion_alpha = 0.8      # relative: weight of the vector list (part F: 0.9 / 0.8 / 0.7)
